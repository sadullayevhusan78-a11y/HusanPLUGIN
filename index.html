<!doctype html><html><head><meta charset="UTF-8"><title>Husan Reels Master</title><link rel="stylesheet" href="style.css"></head><body>
<main class="panel">
<header><div class="brand"><div class="logo">H</div><div><div class="eyebrow">HUSAN STUDIO</div><h1>Reels Master</h1></div></div><span class="version">AI 0.3</span></header>
<section class="hero"><button id="autoEdit" class="primary"><span class="play">▶</span>AUTO MONTAGE</button><div class="hint">Video layerni tanlang va bir marta bosing</div></section>
<section class="card"><div class="section-title">AUTO STYLE</div>
<div class="row"><label>Format</label><select id="format"><option value="reels">9:16 Reels</option></select></div>
<div class="row"><label>Captions</label><select id="captions"><option value="on">Karaoke</option><option value="off">Off</option></select></div>
<div class="row"><label>Cut</label><select id="cut"><option value="smart">Smart + fillers</option><option value="clean">Clean</option></select></div>
</section>
<section class="card"><div class="section-title">MOTION</div>
<button id="punch">Punch-in motion</button><button id="shake">Micro shake</button><button id="fade">Smooth fade</button></section>
<section class="card"><div class="section-title">TOOLS</div>
<button id="createReels">Create 1080 × 1920</button><button id="centerSelected">Center selected</button><button id="fitSelected">Fit selected to frame</button><button id="addText">Add clean subtitle</button></section>
<div id="progressWrap" class="progress-wrap"><div class="progress"><div id="bar"></div></div><div id="progressText">Preparing…</div></div>
<div id="status" class="status">Local engine: checking…</div>
</main><script src="main.js"></script></body></html>

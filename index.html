<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Husan Reels Master</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="panel">
    <header>
      <div>
        <div class="eyebrow">HUSAN</div>
        <h1>Reels Master</h1>
      </div>
      <span class="version">0.1</span>
    </header>

    <section class="card">
      <div class="section-title">REELS</div>
      <button id="createReels">Create 1080 × 1920</button>
      <button id="centerSelected">Center selected</button>
      <button id="fitSelected">Fit selected to frame</button>
    </section>

    <section class="card">
      <div class="section-title">TEXT</div>
      <button id="addText">Add clean subtitle</button>
      <button id="centerText">Center text layer</button>
      <button id="styleText">Minimal text style</button>
    </section>

    <section class="card">
      <div class="section-title">MOTION</div>
      <button id="stagger">Stagger selected layers</button>
      <button id="fade">Quick fade selected</button>
    </section>

    <div id="status" class="status">Ready.</div>
  </main>
  <script src="main.js"></script>
</body>
</html>
